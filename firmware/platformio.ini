[platformio]
default_envs = companion, relay, hub

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino@2.3.7
    jgromes/RadioLib@7.4.0
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit SSD1306@2.5.15
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DEM_FREQUENCY_HZ=915000000L
    -DEM_REGION=1
    -DEM_KEY_ID=1
    -std=gnu++17
build_unflags = -std=gnu++11

[env:companion]
build_flags = ${env.build_flags} -DEM_ROLE=1

[env:relay]
build_flags = ${env.build_flags} -DEM_ROLE=2

[env:hub]
build_flags = ${env.build_flags} -DEM_ROLE=3
